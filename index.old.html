<!DOCTYPE html>
<!-- 本工作台按 WorkBuddy「小台」专家标准生成；本环境下资料库 skill 未加载，采用单文件 HTML + localStorage 兜底方案（在线式加载架构，先渲染界面再异步拉数据，读写失败有明确提示与重试）。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f5fb">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习管理台">
<link rel="apple-touch-icon" href="icon.svg">
<title>学习目标管理台</title>
<style>
:root{
  --bg:#f4f5fb;
  --card:#ffffff;
  --ink:#1f2330;
  --muted:#8a90a6;
  --line:#ecebf3;
  --purple:#7c5cff;
  --purple2:#a78bfa;
  --purple-soft:#f0ecff;
  --green:#22c55e;
  --green-soft:#e7f9ee;
  --red:#ef4444;
  --red-soft:#fdeaea;
  --amber:#f59e0b;
  --amber-soft:#fff4e0;
  --shadow:0 6px 24px rgba(40,30,90,.07);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
input:focus,select:focus{outline:none}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:flex;align-items:center;justify-content:center}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:600;font-size:15px;transition:.15s}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.nav-btn.active{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.32)}
.nav-btn:not(.active):hover{background:var(--purple-soft);color:var(--purple)}
.sync-mini{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 14px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)}
.dot.warn{background:var(--amber)}
.dot.err{background:var(--red)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;align-items:center;gap:10px;padding:14px 18px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
}
.topbar .brand{font-size:16px;padding:0;flex:1}
.content{padding:22px;max-width:1080px;width:100%;margin:0 auto}

/* ===== Cards & generic ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
h2.sec{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;transition:.15s;min-height:44px}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.3)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:var(--purple-soft);color:var(--purple)}
.btn-outline{border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:10px}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.tag-amber{background:var(--amber-soft);color:#b4790a}
.tag-red{background:var(--red-soft);color:var(--red)}
.tag-green{background:var(--green-soft);color:#15803d}
.tag-sup{background:var(--purple-soft);color:var(--purple);font-size:11px;padding:2px 7px}

/* ===== Today ===== */
.today-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fab-bottom{position:sticky;bottom:74px;margin-top:6px}
@media(min-width:768px){.fab-bottom{position:static;bottom:auto}}

.goal-card{border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.goal-card .accent{position:absolute;left:0;top:0;bottom:0;width:6px}
.gc-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.gc-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gc-stat{display:flex;gap:14px;margin:12px 0 6px;flex-wrap:wrap}
.gc-stat .s{font-size:13px;color:var(--muted)}
.gc-stat .s b{display:block;font-size:17px;color:var(--ink);font-weight:700;margin-top:2px}
.gc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.plan-box{background:var(--purple-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55}
.plan-box .t{font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.plan-box .t svg{width:15px;height:15px}

/* banner cards */
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.banner.amber{background:var(--amber-soft);color:#8a5a06}
.banner.red{background:var(--red-soft);color:#a3271f}

/* ===== Overview / Kanban ===== */
.kb-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.kb-grid{grid-template-columns:1fr 1fr}}
.kb-card{border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.kb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.kb-head .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.ring-row{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.ring-num{font-size:13px;color:var(--muted)}
.ring-num b{display:block;font-size:20px;color:var(--ink)}
.kb-stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.kb-stats .k{flex:1;min-width:84px;background:var(--bg);border-radius:12px;padding:9px 11px}
.kb-stats .k .v{font-size:18px;font-weight:700}
.kb-stats .k .l{font-size:12px;color:var(--muted)}
.rec-list{margin-top:6px}
.rec-item{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px dashed var(--line);font-size:13px}
.rec-item .d{color:var(--muted);min-width:78px}
.rec-item .q{font-weight:600}
.rec-item .sup{font-size:11px;background:var(--purple-soft);color:var(--purple);padding:1px 6px;border-radius:6px;font-weight:700}
.rec-item .del{margin-left:auto;color:var(--muted)}
.rec-item .del:active{color:var(--red)}
.kb-chart-title{font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--ink)}

/* ===== Weekly ===== */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wk-summary .c{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.wk-summary .c .v{font-size:20px;font-weight:700}
.wk-summary .c .l{font-size:12px;color:var(--muted);margin-top:2px}
.wk-4{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.wk-4{grid-template-columns:1fr 1fr}}
.wk-4 textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:14px;resize:vertical;min-height:78px;background:var(--card);color:var(--ink)}
.wk-4 .lbl{font-weight:700;font-size:13px;margin-bottom:6px;display:block}

/* ===== Mine ===== */
.mine-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.mine-row .ic{width:40px;height:40px;border-radius:11px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;color:var(--purple)}
.mine-row .ic svg{width:20px;height:20px}
.mine-row .tx{flex:1}
.mine-row .tx .t{font-weight:600}
.mine-row .tx .s{font-size:13px;color:var(--muted)}
.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:s}
.steps li{display:flex;gap:10px;padding:9px 0;font-size:14px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}

/* ===== Modal ===== */
.mask{position:fixed;inset:0;background:rgba(28,22,55,.42);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
@media(min-width:680px){.mask{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:680px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;background:var(--card);color:var(--ink);
}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatch{display:flex;gap:8px;flex-wrap:wrap}
.swatch i{width:26px;height:26px;border-radius:50%;display:inline-block;border:2px solid transparent;cursor:pointer}
.swatch i.on{border-color:var(--ink)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}

/* ===== Toast / Banner ===== */
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;top:26px}
#toast.err{background:var(--red)}
#toast.ok{background:var(--green)}

/* data status banner (top of content) */
#dataBanner{display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:14px}
#dataBanner.show{display:flex}
#dataBanner.loading{background:var(--purple-soft);color:var(--purple)}
#dataBanner.err{background:var(--red-soft);color:var(--red)}
#dataBanner .sp{width:16px;height:16px;border:2px solid var(--purple);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Bottom Tab (mobile) ===== */
.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0;color:var(--muted);font-size:11px;font-weight:600}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{color:var(--purple)}

/* confetti */
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:400;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* ===== Responsive ===== */
@media(max-width:1023px){
  .sidebar{display:none}
  .topbar{display:flex}
  .content{padding:16px 14px 90px}
  .card,.goal-card{padding:16px 14px}
}
@media(min-width:1024px){
  .tabbar{display:none}
}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}

/* ===== Journal (每日记录) ===== */
.journal-why{background:linear-gradient(135deg,#f0ecff,#eef6ff);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#3a3470}
.journal-why b{color:var(--purple)}
.journal-why .q{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.journal-why .q svg{width:17px;height:17px;color:var(--purple)}
.j-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.j-grid{grid-template-columns:1fr}}
.j-card{background:var(--bg);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:8px}
.j-card .jt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.j-card .jt svg{width:16px;height:16px;color:var(--purple)}
.j-card textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;resize:vertical;min-height:52px;background:var(--card);color:var(--ink);width:100%}
.j-timeline{margin-top:6px}
.j-day{margin-bottom:14px}
.j-day .dh{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.j-day .dh .dotd{width:8px;height:8px;border-radius:50%;background:var(--purple)}
.j-item{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.j-item .ih{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--purple);margin-bottom:3px}
.j-item .ih svg{width:14px;height:14px}
.j-item .ib{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.j-item .del{float:right;color:var(--muted)}
.j-item .del:active{color:var(--red)}
.j-insight{background:var(--green-soft);border-radius:10px;padding:8px 11px;margin-top:6px;font-size:12.5px;color:#15803d;display:flex;gap:6px;align-items:flex-start}
.j-insight svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.j-empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}

</head>
<body>
<div class="app">
  <!-- Sidebar (PC) -->
  <aside class="sidebar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4v10l-8 4-8-4V7z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7l8 4 8-4M12 11v10" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></span>学习管理台</div>
    <button class="nav-btn active" data-tab="today"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>今日</button>
    <button class="nav-btn" data-tab="kanban"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="5" height="16" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="5" height="11" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="4" width="4" height="14" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>看板</button>
    <button class="nav-btn" data-tab="weekly"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>周报</button>
    <button class="nav-btn" data-tab="mine"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>我的</button>
    <div class="sync-mini"><span class="dot" id="sbDot"></span><span id="sbTxt">本地存储</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4v10l-8 4-8-4V7z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7l8 4 8-4M12 11v10" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></span>学习管理台</div>
      <button class="btn btn-primary btn-sm" onclick="openGoalModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>新建</button>
    </div>

    <div class="content">
      <div id="dataBanner"></div>

      <!-- TODAY -->
      <section id="tab-today">
        <div class="today-head">
          <h2 class="sec"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--purple)" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="var(--purple)" stroke-width="1.8" stroke-linecap="round"/></svg>今天要处理</h2>
          <button class="btn btn-primary btn-sm" onclick="openGoalModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>新建目标</button>
        </div>
        <div id="todayRollover"></div>
        <div id="todayList"></div>
        <button class="btn btn-primary btn-block fab-bottom" onclick="openGoalModal()"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>＋ 新建学习目标</button>
      </section>

      <!-- KANBAN -->
      <section id="tab-kanban" style="display:none">
        <h2 class="sec"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><rect x="3" y="4" width="5" height="16" rx="1.5" stroke="var(--purple)" stroke-width="1.8"/><rect x="10" y="4" width="5" height="11" rx="1.5" stroke="var(--purple)" stroke-width="1.8"/><rect x="17" y="4" width="4" height="14" rx="1.5" stroke="var(--purple)" stroke-width="1.8"/></svg>看板总览</h2>
        <div class="kb-grid" id="kbGrid"></div>
      </section>

      <!-- WEEKLY -->
      <section id="tab-weekly" style="display:none">
        <h2 class="sec"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="var(--purple)" stroke-width="1.8" stroke-linecap="round"/></svg>周报</h2>
        <div class="wk-nav">
          <button class="btn btn-outline btn-sm" onclick="stepWeek(-1)"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>上一周</button>
          <div id="wkRange" style="font-weight:700"></div>
          <button class="btn btn-outline btn-sm" onclick="stepWeek(1)">下一周<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="card">
          <div class="wk-summary" id="wkSummary"></div>
          <div class="kb-chart-title">本周概览（合计投入分钟）</div>
          <div id="wkBar"></div>
          <div class="wk-4" id="wk4" style="margin-top:14px"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="saveWeekly()"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>保存复盘</button>
            <button class="btn btn-primary" onclick="genWeeklyText()"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>生成周报文本</button>
          </div>
        </div>
      </section>

      <!-- MINE -->
      <section id="tab-mine" style="display:none">

<script>
"use strict";
/* ============ 全局错误捕获：把报错显示到页面（便于手机端排查空白） ============ */
(function(){
  function showErr(msg){
    let box=document.getElementById("errBox");
    if(!box){box=document.createElement("div");box.id="errBox";
      box.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#fff3f3;color:#b00020;border:1px solid #ef4444;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;max-height:50vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.15)";
      document.body.appendChild(box);}
    box.textContent="⚠ 运行错误：\n"+msg;
  }
  window.addEventListener("error",e=>{showErr((e.message||"unknown")+"\n@ "+(e.filename||"")+":"+(e.lineno||""));});
  window.addEventListener("unhandledrejection",e=>{showErr("Promise: "+(e.reason&&e.reason.message||e.reason||"unknown"));});
  window.__showErr=showErr;
})();

/* ============ constants ============ */
const PREFIX="lstm_";
const STORE_KEY=PREFIX+"data_v1";
const COLORS=["#7c5cff","#22c55e","#f59e0b","#ef4444","#3b82f6","#ec4899","#14b8a6","#a855f7"];
const DAY=86400000;
const WEEKDAYS=["日","一","二","三","四","五","六"];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function safeParse(j,d){try{return JSON.parse(j)||d;}catch(e){return d;}}
function pad(n){return n<10?"0"+n:""+n;}
function fmtDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseDate(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=startOfDay(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=startOfDay(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function sameWeek(a,b){return +mondayOf(a)===+mondayOf(b);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s==null?"":""+s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ============ state ============ */
let state={goals:[],records:[],weeklyNotes:{},journal:[]};
let curWeekOffset=0;

/* ============ storage (online-style: render UI first, load async) ============ */
function readStore(){
  // synchronous local fallback read used after async "load" resolves
  const raw=localStorage.getItem(STORE_KEY);
  return raw?safeParse(raw,null):null;
}
function writeStore(){
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
}

/* simulate async online load (本地兜底：用 Promise 包裹 localStorage) */
function loadDataAsync(){
  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
      try{
        const raw=localStorage.getItem(STORE_KEY);
        if(raw===null){resolve(null);return;}      // first visit
        const d=safeParse(raw,null);
        if(!d||!Array.isArray(d.goals)){reject(new Error("数据格式异常"));}
        else resolve(d);
      }catch(e){reject(e);}
    },260);
  });
}
function saveDataAsync(){
  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
      try{localStorage.setItem(STORE_KEY,JSON.stringify(state));resolve();}
      catch(e){reject(e);}
    },180);
  });
}

/* ============ data status banner + sync dot ============ */
function setBanner(type,msg,retry){
  const b=$("#dataBanner");
  b.className="show "+type;
  b.innerHTML = (type==="loading"
      ? '<span class="sp"></span>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>')
    + '<span style="flex:1">'+esc(msg)+'</span>'
    + (retry?'<button class="btn btn-outline btn-sm" onclick="reloadData(true)">重试</button>':'');
}
function hideBanner(){$("#dataBanner").className="";}
function setSyncDot(stateName){
  const dot=$("#sbDot"),txt=$("#sbTxt");
  dot.className="dot "+(stateName==="ok"?"ok":stateName==="warn"?"warn":"err");
  txt.textContent = stateName==="ok"?"本地已保存"
    : stateName==="warn"?"离线模式":"保存失败";
}

/* async load, then render */
function reloadData(showToast){
  setBanner("loading","正在读取数据…");
  loadDataAsync().then(d=>{
    if(d===null){
      // first visit -> seed sample
      state=buildSample();
      return saveDataAsync().then(()=>{hideBanner();setSyncDot("ok");renderAll();if(showToast)toast("已载入示例数据","ok");});
    }
    state=d;

/* ============ calc ============ */
function recsOf(gid){return state.records.filter(r=>r.goalId===gid);}
function doneTotal(g){return recsOf(g.id).reduce((s,r)=>s+r.qty,0);}
function remain(g){return Math.max(0,g.total-doneTotal(g));}
function rate(g){return g.total>0?Math.min(100,Math.round(doneTotal(g)/g.total*100)):0;}
function daysLeft(g){const due=parseDate(g.due);const today=startOfDay(new Date());return Math.round((due-today)/DAY);}
function suggest(g){
  const left=daysLeft(g);const rem=remain(g);
  if(left<=0)return rem; // overdue -> finish all
  if(rem<=0)return 0;
  const v=rem/left;return v<=1?Math.max(1,Math.ceil(v)):Math.round(v);
}
// continuous days (with Monday-weekly 1 rest day).
// 规则：本周一至今，第一次漏打卡视为休息日（不中断）；从最近一次打卡日往回数连续天数，
// 遇到历史真实中断则截断。返回 {streak, missedToday, broken} —— broken=true 仅当 streak 归零（真正断开）。
function continuity(g){
  const today=startOfDay(new Date());
  const mon=mondayOf(today);
  const set=new Set(recsOf(g.id).map(r=>fmtDate(parseDate(r.date))));
  // 本周内漏打卡天数（含今天之前），用于判断"休息日"是否已被用掉
  let restUsed=false;
  const thisWeekMiss=[];
  for(let d=mon; +d<=+addDays(today,-1); d=addDays(d,1)){
    if(!set.has(fmtDate(d))){ thisWeekMiss.push(fmtDate(d)); }
  }
  restUsed = thisWeekMiss.length>=1; // 本周已有过漏打卡 -> 休息日已用（首次=豁免）
  let streak=0;let cur=startOfDay(today);let missedToday=false;
  while(true){
    const key=fmtDate(cur);
    if(set.has(key)){streak++;cur=addDays(cur,-1);continue;}
    // 今天漏打卡
    if(+cur>=+today){
      // 本周首次漏打卡 -> 休息日豁免，但今天不计入连续；若本周已有其他漏打卡则中断
      if(thisWeekMiss.length===0){ cur=addDays(cur,-1); missedToday=true; continue; }
      else { break; } // 休息日已用，今天漏打 -> 中断
    }
    // 历史上的漏打卡日
    if(+cur>=+mon){
      // 本周内的漏打卡（非今天）：首个豁免，其余中断
      if(!restUsed){ restUsed=true; cur=addDays(cur,-1); continue; }
      else break;
    }else{
      break; // 上周及更早的真实中断
    }
  }
  const broken = streak===0 && !set.has(fmtDate(today));
  if(!set.has(fmtDate(today))) missedToday=true;
  return {streak,missedToday,broken};
}
// estimated completion date by last-7-day avg speed
function eta(g){
  const today=startOfDay(new Date());
  const last7=recsOf(g.id).filter(r=>{const d=parseDate(r.date);return d>=addDays(today,-6)&&d<=today;});
  if(last7.length===0)return null;
  const sum=last7.reduce((s,r)=>s+r.qty,0);
  const avg=sum/7;
  if(avg<=0)return null;
  const rem=remain(g);
  const need=Math.ceil(rem/avg);
  return addDays(today,need);
}
// 14-day minutes per goal (stacked)
function last14Records(){
  const today=startOfDay(new Date());
  const from=addDays(today,-13);
  return state.records.filter(r=>{const d=parseDate(r.date);return d>=from&&d<=today;});
}

function ringSVG(pct,color){
  const r=26,c=2*Math.PI*r;const off=c*(1-pct/100);
  return '<svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="#eee" stroke-width="8"/>'+
    '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" '+
    'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 36 36)"/>'+
    '<text x="36" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2330">'+pct+'%</text></svg>';
}

function drawMiniBars(elId,gid){
  const today=startOfDay(new Date());const days=[];
  for(let i=13;i>=0;i--)days.push(addDays(today,-i));
  const data=days.map(d=>{
    const ds=fmtDate(d);
    return state.records.filter(r=>r.goalId===gid&&r.date===ds).reduce((s,r)=>s+(r.minutes||0),0);
  });
  const hasMin=data.some(v=>v>0);
  const el=$("#"+elId);
  if(!hasMin){el.innerHTML='<div class="muted" style="font-size:12px;padding:4px 0">暂无分钟记录，不硬凑柱状图</div>';return;}
  const max=Math.max(...data,1);
  const W=560,H=70,n=data.length,bw=W/n*0.62,gap=W/n*0.38;
  let bars="";
  data.forEach((v,i)=>{
    const h=Math.max(0,v/max*(H-14));
    const x=i*(bw+gap)+gap/2;const y=H-h-2;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+'#7c5cff'+(v?'':'22')+'"/>';
  });
  // x labels (every 2)
  let labels="";
  data.forEach((v,i)=>{if(i%2===0||i===n-1){const x=i*(bw+gap)+gap/2+bw/2;labels+='<text x="'+x.toFixed(1)+'" y="'+(H+2)+'" font-size="9" fill="#8a90a6" text-anchor="middle">'+days[i].getDate()+'</text>';}});
  el.innerHTML='<svg viewBox="0 0 '+W+' '+(H+4)+'" width="100%" preserveAspectRatio="none" style="display:block">'+bars+labels+'</svg>';
}

function buildSwatch(sel,cur,cb){

  COLORS.forEach(c=>{
    const i=document.createElement("i");i.style.background=c;if(c===cur)i.className="on";
    i.onclick=()=>{$$(sel+" i").forEach(x=>x.className="");i.className="on";cb(c);};

function genWeeklyText(){
  const mon=addDays(mondayOf(new Date()),curWeekOffset*7);
  const sun=addDays(mon,6);
  const recs=state.records.filter(r=>{const d=parseDate(r.date);return d>=mon&&d<=sun;});
  const totalQty=recs.reduce((s,r)=>s+r.qty,0);
  const daysCount=new Set(recs.map(r=>r.date)).size;
  const minSum=recs.reduce((s,r)=>s+(r.minutes||0),0);
  const key=fmtDate(mon);const n=(state.weeklyNotes&&state.weeklyNotes[key])||{};
  const goals=state.goals.map(g=>"  · "+g.name+"："+doneTotal(g)+"/"+g.total+g.unit+"（"+rate(g)+"%，连"+continuity(g).streak+"天）").join("\n");
  const txt=`【学习目标周报】${fmtDate(mon)} ~ ${fmtDate(sun)}
本周投入：${totalQty}（打卡 ${daysCount} 天 · ${minSum} 分钟）
目标进度：
${goals}
—— 四栏复盘 ——
保持：${n.keep||"（待填）"}
问题：${n.prob||"（待填）"}
尝试：${n.try||"（待填）"}
下周预案：${n.plan||"（待填）"}`;
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("周报文本已复制","ok"),()=>fallbackCopy(txt));}
  else fallbackCopy(txt);
  // also show in modal-ish alert? use toast + console
  console.log(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("周报文本已复制","ok");}catch(e){toast("复制失败，请查看控制台");}
  document.body.removeChild(ta);
}

/* ============ 跨设备同步：导出/导入 JSON + 导出 CSV ============ */
function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},300);
}
function exportJSON(){
  // 同步读取最新 state（saveDataAsync 已写盘，这里直接序列化当前内存）
  const data=JSON.parse(JSON.stringify(state));
  data._exportedAt=fmtDate(new Date())+" "+pad(new Date().getHours())+":"+pad(new Date().getMinutes());
  data._app="lstm";
  downloadFile("学习目标管理台_备份_"+fmtDate(new Date())+".json",JSON.stringify(data,null,2),"application/json");
  toast("备份已导出","ok");
}
function importJSON(){const inp=$("#importFile");inp.value="";inp.click();}
function handleImport(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(d._app!=="lstm"||!Array.isArray(d.goals)){toast("文件格式不符，不是本工作台备份","err");return;}
      if(!confirm("导入将用备份覆盖当前全部数据（目标/打卡/周报/每日记录），确认继续？"))return;
      state={goals:d.goals||[],records:d.records||[],weeklyNotes:d.weeklyNotes||{},journal:d.journal||[]};
      if(d._sample!==undefined)state._sample=d._sample;
      persist("已从备份恢复数据");
      toast("导入成功，数据已同步","ok");
    }catch(err){toast("解析失败："+err.message,"err");}
  };
  reader.readAsText(file);
}
function exportCSV(){
  // 导出打卡记录 + 每日记录为 CSV（含 BOM 防中文乱码）
  let rows=['类型,日期,目标,数值,单位,分钟,备注'];
  state.records.forEach(r=>{const g=state.goals.find(x=>x.id===r.goalId);
    rows.push(['打卡',r.date,(g?g.name:''),r.qty,(g?g.unit:''),r.minutes||0,(r.supplement?'补记':'')].map(csvCell).join(','));});
  state.journal.forEach(j=>{
    if(j.time)rows.push(['日记',j.date,'时间','', '', '',j.time].map(csvCell).join(','));
    if(j.learn)rows.push(['日记',j.date,'知识点','', '', '',j.learn].map(csvCell).join(','));
    if(j.money)rows.push(['日记',j.date,'钱','', '', '',j.money].map(csvCell).join(','));
    if(j.mood)rows.push(['日记',j.date,'情绪','', '', '',j.mood].map(csvCell).join(','));
  });
  downloadFile("学习目标管理台_数据_"+fmtDate(new Date())+".csv","\uFEFF"+rows.join("\n"),"text/csv;charset=utf-8");
  toast("CSV 已导出","ok");
}
function csvCell(v){v=v==null?"":""+v;if(/[",\n]/.test(v))return '"'+v.replace(/"/g,'""')+'"';return v;}

/* ============ GitHub 云端同步（数据存仓库 data.json） ============ */
const GH_KEY="lstm_ghcfg";
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY))||{};}catch(e){return {};}}
function ghSaveCfg(c){localStorage.setItem(GH_KEY,JSON.stringify(c));}
function ghApi(cfg,path,opts){
  opts=opts||{};
  const url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/"+path;
  const h={"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"};
  return fetch(url,{method:opts.method||"GET",headers:h,body:opts.body});
}
function ghSetStatus(txt,type){
  const el=$("#ghStatus");if(!el)return;
  el.textContent=txt;
  el.style.color = type==="ok"?"var(--green)":type==="err"?"var(--red)":"var(--muted)";
}
function ghConnect(){
  const cfg={token:$("#gh_token").value.trim(),owner:$("#gh_owner").value.trim(),repo:$("#gh_repo").value.trim(),branch:$("#gh_branch").value.trim()||"main"};
  if(!cfg.token||!cfg.owner||!cfg.repo){toast("请填齐 Token / owner / 仓库名","err");return;}
  ghSetStatus("正在连接…","");
  ghApi(cfg,"").then(r=>r.json()).then(j=>{
    if(j.message&&j.message.includes("Bad credentials")){ghSetStatus("连接失败：Token 无效","err");toast("Token 无效，请检查","err");return;}
    if(!j.default_branch){ghSetStatus("连接失败：仓库不存在或无权限","err");return;}
    cfg.branch=j.default_branch||cfg.branch;
    $("#gh_branch").value=cfg.branch;
    ghSaveCfg(cfg);
    ghSetStatus("已连接 "+cfg.owner+"/"+cfg.repo+" @"+cfg.branch,"ok");
    toast("GitHub 已连接","ok");
    ghDownload(true); // 连接后自动拉取一次
  }).catch(e=>{ghSetStatus("连接失败："+e.message,"err");});
}
function ghUpload(silent){
  const cfg=ghCfg();
  if(!cfg.token){toast("请先连接 GitHub","err");return;}
  ghSetStatus("上传中…","");
  const content=JSON.stringify({goals:state.goals,records:state.records,weeklyNotes:state.weeklyNotes,journal:state.journal,_app:"lstm",_savedAt:new Date().toISOString()},null,0);
  const b64=btoa(unescape(encodeURIComponent(content)));
  // 先取 sha（若存在）
  ghApi(cfg,"contents/data.json").then(r=>r.status===200?r.json():null).then(meta=>{
    const body={message:"sync data "+new Date().toISOString(),content:b64,branch:cfg.branch};
    if(meta&&meta.sha)body.sha=meta.sha;
    return ghApi(cfg,"contents/data.json",{method:"PUT",body:JSON.stringify(body)});
  }).then(r=>{
    if(!r.ok)return r.json().then(j=>Promise.reject(new Error(j.message||r.status)));
    ghSetStatus("已上传到云端 "+new Date().toLocaleTimeString(),"ok");
    if(!silent)toast("已上传到 GitHub 云端","ok");
  }).catch(e=>{ghSetStatus("上传失败："+e.message,"err");if(!silent)toast("上传失败："+e.message,"err");});
}
function ghDownload(silent){
  const cfg=ghCfg();
  if(!cfg.token){toast("请先连接 GitHub","err");return;}
  ghSetStatus("从云端拉取…","");
  ghApi(cfg,"contents/data.json").then(r=>{
    if(r.status===404){ghSetStatus("云端暂无数据，可先上传","ok");if(!silent)toast("云端还没有数据，先点上传吧","ok");return null;}
    if(!r.ok)return r.json().then(j=>Promise.reject(new Error(j.message||r.status)));
    return r.json();
  }).then(meta=>{
    if(!meta)return;
    const content=decodeURIComponent(escape(atob(meta.content.replace(/\n/g,""))));
    const d=JSON.parse(content);
    state={goals:d.goals||[],records:d.records||[],weeklyNotes:d.weeklyNotes||{},journal:d.journal||[]};
    persist("已从 GitHub 云端同步");
    ghSetStatus("已从云端同步 "+new Date().toLocaleTimeString(),"ok");
    if(!silent)toast("已从 GitHub 同步","ok");
  }).catch(e=>{ghSetStatus("拉取失败："+e.message,"err");if(!silent)toast("拉取失败："+e.message,"err");});
}
function ghDisconnect(){
  if(!confirm("断开 GitHub 同步？本地 Token 配置将被清除（仓库中的数据保留）。"))return;
  localStorage.removeItem(GH_KEY);
  $("#gh_token").value="";
  ghSetStatus("已断开","");
  toast("已断开 GitHub 同步","ok");
}
// 勾选"自动同步"：每次 persist 后自动上传
let _ghAuto=false;
function ghAutoToggle(el){_ghAuto=el.checked;localStorage.setItem("lstm_ghauto",_ghAuto?"1":"0");}
function ghInit(){
  const cfg=ghCfg();
  if(cfg.token){$("#gh_token").value=cfg.token;$("#gh_owner").value=cfg.owner||"";$("#gh_repo").value=cfg.repo||"";$("#gh_branch").value=cfg.branch||"main";
    ghSetStatus("已连接 "+cfg.owner+"/"+cfg.repo+" @"+cfg.branch,"ok");}
  _ghAuto=localStorage.getItem("lstm_ghauto")==="1";

function persist(msg){
  setSyncDot("warn");
  saveDataAsync().then(()=>{setSyncDot("ok");renderAll();if(msg)toast(msg,"ok");
    if(_ghAuto && ghCfg().token){ ghUpload(true); }
  })
    .catch(err=>{setSyncDot("err");toast("保存失败："+err.message,"err");
      setBanner("err","写入失败："+err.message+"。数据在内存中未丢失，可点重试再次保存。",true);});
}

/* ============ confetti ============ */
function confettiBurst(){
  const cols=["#7c5cff","#22c55e","#f59e0b","#ef4444","#3b82f6","#ec4899"];
  for(let i=0;i<28;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.2)+"s";
    c.style.transform="rotate("+(Math.random()*360)+"deg)";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

/* ============ PWA: 注册 Service Worker（离线可用 + 可安装到桌面） ============ */
/* 默认不注册 SW，避免手机端缓存旧空白页；加 ?pwa=1 才启用。 */
const _enableSW = new URLSearchParams(location.search).get("pwa")==="1";
if(_enableSW && "serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})
      .then(reg=>{
        if(reg.waiting){reg.waiting.postMessage({type:"SKIP_WAITING"});}
        reg.addEventListener("updatefound",()=>{
          const nw=reg.installing;
          if(nw){nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller){window.location.reload();}});}
        });
      })
      .catch(()=>{});
    navigator.serviceWorker.ready.then(reg=>{if(reg.waiting)reg.waiting.postMessage({type:"SKIP_WAITING"});}).catch(()=>{});
  });
}
// 若之前已注册过旧 SW，主动注销，清掉缓存空白页
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
}
</script>
